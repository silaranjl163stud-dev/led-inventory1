# ============================================================
# Nginx config for Cloudflare Tunnel (cloudflared)
#
# Traffic flow:
#   Browser → Cloudflare Edge (HTTPS) → cloudflared tunnel → Nginx (HTTP, localhost only)
#
# Nginx does NOT need SSL — cloudflared handles encryption.
# Nginx only listens on localhost so direct internet access is blocked.
#
# Deploy:
#   sudo cp nginx.conf /etc/nginx/sites-available/inventory.jmacxled.com
#   sudo ln -sf /etc/nginx/sites-available/inventory.jmacxled.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# cloudflared config.yml should point to:
#   service: http://localhost:80
# ============================================================

server {
    listen 80;
    server_name inventory.jmacxled.com;

    # Document root
    root /var/www/inventory/public;
    index index.php;

    # Security headers
    # (X-Frame, HSTS, etc. are best set at Cloudflare dashboard level for tunnel setups)
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Block hidden / dotfiles
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    # Route application requests through Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}